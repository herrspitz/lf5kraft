<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lerncheck: Die vibrierende Getriebewelle</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .fade-in { animation: fadeIn 0.5s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .correct { border: 2px solid #10b981; background-color: #ecfdf5; }
        .wrong { border: 2px solid #ef4444; background-color: #fef2f2; }
        .option-btn:disabled { cursor: not-allowed; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col font-sans">

    <!-- Header -->
    <header class="bg-blue-700 text-white p-4 shadow-md">
        <div class="container mx-auto flex justify-between items-center px-2">
            <div>
                <h1 class="text-lg md:text-xl font-bold uppercase tracking-tight">Interaktiver Lerncheck</h1>
                <p class="text-xs text-blue-200">Thema: Zerspankräfte & Spannmittel</p>
            </div>
            <div id="progress" class="text-sm bg-blue-800 px-3 py-1 rounded-full font-mono">Frage 1 / 13</div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow container mx-auto px-4 py-6 max-w-3xl">
        <div id="quiz-container" class="bg-white rounded-2xl shadow-xl border border-slate-200 p-6 md:p-10 fade-in">
            
            <!-- Question View -->
            <div id="question-box">
                <div id="category" class="inline-block px-2 py-1 rounded bg-blue-100 text-blue-700 text-[10px] font-bold uppercase mb-4 tracking-widest">Kategorie</div>
                <h2 id="question-text" class="text-xl md:text-2xl font-bold mb-8 text-slate-800 leading-snug">Lade Frage...</h2>
                
                <div id="options" class="space-y-4">
                    <!-- Options injected here -->
                </div>

                <div id="feedback" class="mt-8 hidden rounded-xl p-5 border-l-4 transition-all duration-300">
                    <div class="flex items-start">
                        <div id="feedback-icon" class="text-2xl mr-4"></div>
                        <div>
                            <p id="feedback-title" class="font-bold text-lg mb-1"></p>
                            <p id="feedback-text" class="text-sm md:text-base leading-relaxed text-slate-700"></p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Summary View -->
            <div id="summary" class="hidden text-center py-10">
                <div class="w-20 h-20 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center mx-auto mb-6 text-4xl">🏆</div>
                <h2 class="text-3xl font-bold mb-2 text-slate-800">Check abgeschlossen!</h2>
                <p class="text-slate-500 mb-8">Du hast die Analyse der vibrierenden Welle beendet.</p>
                <div id="score-display" class="text-6xl font-black text-blue-700 mb-10">0 / 0</div>
                <button onclick="location.reload()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 px-10 rounded-xl transition-all shadow-lg hover:shadow-blue-200">
                    Training Neustarten
                </button>
            </div>
        </div>
    </main>

    <!-- Navigation -->
    <footer class="p-6 pb-10">
        <div class="container mx-auto flex justify-center">
            <button id="next-btn" class="hidden bg-slate-800 hover:bg-slate-900 text-white font-bold py-4 px-12 rounded-xl shadow-xl transition-all transform active:scale-95 flex items-center">
                <span>Nächste Frage</span>
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 ml-2" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M10.293 3.293a1 1 0 011.414 0l6 6a1 1 0 010 1.414l-6 6a1 1 0 01-1.414-1.414L14.586 11H3a1 1 0 110-2h11.586l-4.293-4.293a1 1 0 010-1.414z" clip-rule="evenodd" />
                </svg>
            </button>
        </div>
    </footer>

    <script>
        const questions = [
            {
                category: "Zerspankräfte",
                question: "In welche drei Komponenten lässt sich die Zerspankraft Fe beim Längsdrehen zerlegen?",
                options: [
                    "Schnittkraft, Vorschubkraft und Passivkraft",
                    "Hauptkraft, Wirkkraft und Vorschubkraft",
                    "Schnittkraft, Vorschubkraft und Normalkraft"
                ],
                correct: 0,
                explanation: "Die Zerspankraft Fe wird im Raum in die drei orthogonalen Komponenten Schnittkraft (Fc), Vorschubkraft (Ff) und Passivkraft (Fp) zerlegt. In der Fachliteratur wird die dritte Kraft explizit als Passivkraft bezeichnet, da sie keine Arbeit verrichtet."
            },
            {
                category: "Spannmittel & Stabilität",
                question: "Warum werden beim Schlichten oft 'weiche Backen' im Dreibackenfutter eingesetzt?",
                options: [
                    "Wegen der höheren Dämpfungseigenschaft des ungehärteten Materials bei Schwingungen",
                    "Um Druckstellen auf bereits bearbeiteten Flächen zu vermeiden und eine hohe Rundlaufgenauigkeit zu erzielen",
                    "Weil sie eine höhere radiale Spannkraft bei niedrigen Schlicht-Vorschüben ermöglichen"
                ],
                correct: 1,
                explanation: "Weiche Backen werden im Futter auf den Spanndurchmesser ausgedreht. Dies schont die Oberfläche (keine Abdrücke) und sorgt für einen nahezu perfekten Rundlauf des Werkstücks, da sie formschlüssig anliegen."
            },
            {
                category: "Problem-Analyse",
                question: "Das Werkzeug wird in der Halterung verschoben. Welche Kraft ist hierfür meist verantwortlich?",
                options: [
                    "Die Schnittkraft (Fc), da sie die betragsmäßig größte Komponente ist",
                    "Die Vorschubkraft (Ff), da sie parallel zum Werkzeugschaft wirkt",
                    "Die Passivkraft (Fp), da sie senkrecht zur Werkzeugachse abdrängt"
                ],
                correct: 0,
                explanation: "Die Schnittkraft Fc wirkt in Richtung der Hauptbewegung (tangential). Da sie die betragsmäßig größte Kraftkomponente ist, überwindet sie bei unzureichender Klemmung am ehesten die Reibkraft der Werkzeughalterung."
            },
            {
                category: "Spannmittel: Spitzen",
                question: "Welchen wesentlichen Vorteil bietet das 'Spannen zwischen Spitzen'?",
                options: [
                    "Die Werkstücklänge wird durch die thermische Ausdehnung nicht beeinflusst",
                    "Höchste Rundlaufgenauigkeit, auch wenn das Werkstück zum Zwischenmessen entnommen und wieder eingesetzt wird",
                    "Vollständige Aufnahme der Schnittkraft durch die formschlüssige Zentrierung"
                ],
                correct: 1,
                explanation: "Da das Werkstück über Zentrierbohrungen fixiert wird, ist die Position zur Drehachse immer identisch. Bei Futterspannung hingegen führt jedes neue Einspannen zu minimalem Versatz."
            },
            {
                category: "Kräfte & Geometrie",
                question: "Wie wirkt sich ein stumpfes Werkzeug auf die Passivkraft Fp aus?",
                options: [
                    "Fp sinkt durch die zunehmende Reibungswärme am Werkstück",
                    "Fp steigt massiv an, was die Abdrängung und Schwingungsneigung erhöht",
                    "Fp bleibt konstant, während nur die Schnittkraft Fc ansteigt"
                ],
                correct: 1,
                explanation: "Verschleiß (besonders Freiflächenverschleiß) vergrößert die Kontaktfläche. Das Werkzeug 'schneidet' weniger und 'drückt' mehr, was die Passivkraft und damit die Abdrängung der dünnen Welle verstärkt."
            },
            {
                category: "Spannmittel: Mitnehmer",
                question: "Unter welcher Bedingung ist der Einsatz eines Stirnseitenmitnehmers zwingend erforderlich?",
                options: [
                    "Wenn das Werkstück über die gesamte Länge in einer Aufspannung überdreht werden muss",
                    "Wenn das Werkstück kein Zentrierzentrum an der Reitstockseite aufweist",
                    "Bei Werkstücken mit einem Schlankheitsgrad (L/D) von über 10:1"
                ],
                correct: 0,
                explanation: "Der Stirnseitenmitnehmer greift in die Stirnseite. Da kein Spannmittel den Umfang verdeckt, kann der Meißel die gesamte Außenkontur ohne Kollisionsgefahr abfahren."
            },
            {
                category: "Spannmittel: Lünetten",
                question: "Was charakterisiert die 'mitlaufende Lünette' im Vergleich zur feststehenden?",
                options: [
                    "Sie wird auf dem Maschinenbett befestigt und folgt der Wärmeausdehnung",
                    "Sie ist am Werkzeugschlitten befestigt und stützt direkt gegenüber der Wirkstelle des Meißels",
                    "Sie rotiert mit der Spindeldrehzahl, um Reibung an den Backen zu vermeiden"
                ],
                correct: 1,
                explanation: "Die mitlaufende Lünette stützt dort, wo die Kraft entsteht. So wird die Welle genau an dem Punkt stabilisiert, an dem der Meißel sie wegzudrücken versucht."
            },
            {
                category: "Fehleranalyse",
                question: "Die Welle ist mittig 0,15 mm dünner (konkav). Warum tritt dieser Fehler trotz korrekter Schnittwerte auf?",
                options: [
                    "Durch die ungleiche Wärmeverteilung (Mitte wird heißer als Enden)",
                    "Die elastische Durchbiegung ist in der Mitte am größten, wodurch das Werkstück dem Meißel weniger ausweicht",
                    "Die Welle weicht der Passivkraft an den Enden durch die starre Einspannung weniger aus als in der Mitte"
                ],
                correct: 2,
                explanation: "In der Mitte ist die Welle am instabilsten. Durch die Passivkraft biegt sie sich elastisch weg, was zu Maßabweichungen führt. Wenn sie dort zudem schwingt (Rattern), verstärkt sich der Effekt des Formfehlers."
            },
            {
                category: "Spannmittel: Reitstock",
                question: "Welche primäre Gefahr besteht beim Verzicht auf den Reitstock bei dieser 270 mm langen Welle?",
                options: [
                    "Die Spindellagerung wird durch die einseitige Last zerstört",
                    "Das Werkstück kann durch die Hebelwirkung der Schnittkraft aus dem Futter gehebelt werden oder stark flattern",
                    "Der Vorschub bricht aufgrund des zu hohen Widerstands ab"
                ],
                correct: 1,
                explanation: "Ohne Reitstock wirkt das Werkstück wie ein langer Hebel. Schon geringe Kräfte am freien Ende führen zu großen Momenten und massiven Schwingungen am dünnen Durchmesser."
            },
            {
                category: "Spannmittel: Zentrierbohrung",
                question: "Welche Aufgabe übernimmt die Zentrierspitze bei der Bearbeitung der Welle?",
                options: [
                    "Sie nimmt die Passivkraft Fp auf und verhindert so das radiale Ausweichen des freien Endes",
                    "Sie dient als Drehzahlwächter und verhindert das Rutschen im Futter",
                    "Sie reduziert die Reibung zwischen Werkstück und Planschlitten"
                ],
                correct: 0,
                explanation: "Die Zentrierspitze stützt die Welle radial ab. Damit wirkt sie direkt der Passivkraft entgegen, die sonst das Werkstück aus der Drehmitte drängen würde."
            },
            {
                category: "Spannmittel: Vergleich",
                question: "Ein Werkstück wird im Dreibackenfutter gespannt, gewendet und erneut gespannt. Welches Problem tritt hier typischerweise auf?",
                options: [
                    "Die Schnittkraft Fc sinkt bei der zweiten Aufspannung",
                    "Es entsteht ein Planlauffehler an der gewendeten Stirnseite",
                    "Es entsteht ein Rundlauffehler zwischen den in zwei Aufspannungen gedrehten Abschnitten"
                ],
                correct: 2,
                explanation: "Ein Dreibackenfutter spannt nie exakt auf den Mikrometer genau wie in der ersten Aufspannung. Das führt zu einem Versatz (Rundlauffehler) zwischen den beiden Hälften der Welle."
            },
            {
                category: "Schnittwerte",
                question: "Welcher Effekt tritt bei zu niedriger Schnittgeschwindigkeit an der Schlichtoberfläche auf?",
                options: [
                    "Das Material wird plastisch verformt statt zerspant, was Risse verursacht",
                    "Es bilden sich Aufbauschneiden, die periodisch abreißen und die Oberfläche (Ra 0,8) aufrauen",
                    "Der Spanwinkel vergrößert sich unerwünscht durch die fehlende Fliehkraft"
                ],
                correct: 1,
                explanation: "Bei niedrigen Geschwindigkeiten verschweißen Werkstoffteilchen mit der Schneide (Aufbauschneide). Diese fungiert als unkontrollierte Schneide und hinterlässt beim Abreißen Krater in der Oberfläche."
            },
            {
                category: "Spannmittel: Setzstock",
                question: "Warum reicht bei sehr langen Wellen die Zentrierspitze allein oft nicht aus?",
                options: [
                    "Weil die axiale Spannkraft des Reitstocks die Welle zum Ausknicken bringt",
                    "Weil die Welle trotz Spitzenlagerung in der Mitte elastisch durchbiegen und vibrieren kann",
                    "Weil die Zentrierspitze die Schnittgeschwindigkeit begrenzt"
                ],
                correct: 1,
                explanation: "Auch wenn beide Enden fixiert sind, bleibt die Mitte der Welle ein schwingungsfähiges System. Ein Setzstock bietet hier einen dritten Stützpunkt, um die Durchbiegung in der Mitte zu unterbinden."
            }
        ];

        let currentQuestion = 0;
        let score = 0;
        let answered = false;

        const qContainer = document.getElementById('quiz-container');
        const qBox = document.getElementById('question-box');
        const summary = document.getElementById('summary');
        const catLabel = document.getElementById('category');
        const qText = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options');
        const feedbackBox = document.getElementById('feedback');
        const feedbackTitle = document.getElementById('feedback-title');
        const feedbackText = document.getElementById('feedback-text');
        const feedbackIcon = document.getElementById('feedback-icon');
        const nextBtn = document.getElementById('next-btn');
        const progressLabel = document.getElementById('progress');
        const scoreDisplay = document.getElementById('score-display');

        function loadQuestion() {
            const q = questions[currentQuestion];
            answered = false;
            
            qContainer.classList.remove('fade-in');
            void qContainer.offsetWidth; 
            qContainer.classList.add('fade-in');

            catLabel.innerText = q.category;
            qText.innerText = q.question;
            progressLabel.innerText = `Frage ${currentQuestion + 1} / ${questions.length}`;
            
            optionsContainer.innerHTML = '';
            q.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = "option-btn w-full text-left p-4 md:p-5 rounded-xl border-2 border-slate-100 bg-slate-50 hover:border-blue-300 hover:bg-blue-50 transition-all flex items-center group shadow-sm";
                btn.innerHTML = `
                    <span class="flex-shrink-0 w-10 h-10 rounded-lg bg-white border border-slate-200 flex items-center justify-center mr-4 group-hover:border-blue-200 font-bold text-slate-400 group-hover:text-blue-500 transition-colors">${String.fromCharCode(65 + index)}</span>
                    <span class="text-sm md:text-base font-medium text-slate-700">${opt}</span>
                `;
                btn.onclick = () => checkAnswer(index);
                optionsContainer.appendChild(btn);
            });

            feedbackBox.classList.add('hidden');
            nextBtn.classList.add('hidden');
        }

        function checkAnswer(index) {
            if (answered) return;
            answered = true;

            const q = questions[currentQuestion];
            const buttons = optionsContainer.querySelectorAll('button');
            
            if (index === q.correct) {
                score++;
                buttons[index].classList.add('correct');
                buttons[index].classList.remove('bg-slate-50', 'border-slate-100');
                showFeedback(true, q.explanation);
            } else {
                buttons[index].classList.add('wrong');
                buttons[index].classList.remove('bg-slate-50', 'border-slate-100');
                buttons[q.correct].classList.add('correct');
                buttons[q.correct].classList.remove('bg-slate-50', 'border-slate-100');
                showFeedback(false, q.explanation);
            }

            buttons.forEach(btn => btn.disabled = true);
            nextBtn.classList.remove('hidden');
        }

        function showFeedback(isCorrect, text) {
            feedbackBox.classList.remove('hidden', 'border-green-500', 'bg-green-50', 'border-red-500', 'bg-red-50');
            
            if (isCorrect) {
                feedbackBox.classList.add('border-green-500', 'bg-green-50');
                feedbackTitle.innerText = "Richtig!";
                feedbackTitle.className = "font-bold text-lg mb-1 text-green-700";
                feedbackIcon.innerHTML = "✨";
            } else {
                feedbackBox.classList.add('border-red-500', 'bg-red-50');
                feedbackTitle.innerText = "Fachlicher Hintergrund:";
                feedbackTitle.className = "font-bold text-lg mb-1 text-red-700";
                feedbackIcon.innerHTML = "💡";
            }
            
            feedbackText.innerText = text;
        }

        nextBtn.onclick = () => {
            currentQuestion++;
            if (currentQuestion < questions.length) {
                loadQuestion();
            } else {
                showSummary();
            }
        };

        function showSummary() {
            qBox.classList.add('hidden');
            nextBtn.classList.add('hidden');
            summary.classList.remove('hidden');
            progressLabel.classList.add('hidden');
            scoreDisplay.innerText = `${score} / ${questions.length}`;
        }

        window.onload = loadQuestion;
    </script>
</body>
</html>
